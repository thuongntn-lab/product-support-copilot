<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PS Copilot · Usage</title>
<style>body{font:15px system-ui;max-width:1200px;margin:32px auto;padding:0 16px;color:#172018;background:#f8faf8}input,button{padding:9px;border:1px solid #ccd5cc;border-radius:8px}button{cursor:pointer;background:#ff542e;color:white;border:0}.cards{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.card{padding:16px 22px;background:#fff;border-radius:12px;min-width:140px;box-shadow:0 2px 12px #dfe5df}strong{display:block;font-size:26px}table{border-collapse:collapse;width:100%;background:#fff;table-layout:auto}td,th{text-align:left;border-bottom:1px solid #e1e7e1;padding:10px;vertical-align:top}.device-id{min-width:270px;word-break:break-all;font:13px ui-monospace,SFMono-Regular,Consolas,monospace}</style></head>
<body><h1>Product Support Copilot</h1><p>Dashboard quản trị nội bộ · tự cập nhật khi mở trang · ID thiết bị ẩn danh</p><section id="cards" class="cards"></section><h2>Thống kê từng MVP</h2><table><thead><tr><th>MVP</th><th>Số lượt dùng</th></tr></thead><tbody id="mvp-rows"></tbody></table><h2>Thiết bị</h2><table><thead><tr><th>Thiết bị (ID đầy đủ)</th><th>Phiên bản</th><th>Lần dùng cuối</th><th>Thời gian hoạt động</th><th>Trạng thái</th></tr></thead><tbody id="rows"></tbody></table>
<script>async function loadUsage(){const r=await fetch('/api/usage/summary');const payload=await r.json();if(!r.ok)return alert(payload.error||'Không tải được dữ liệu');const b=payload.data;document.querySelector('#cards').innerHTML=[['Đã cài',b.totals.installed],['Đang hoạt động',b.totals.active],['MVP dùng nhiều nhất',b.mvpUsage[0]?b.mvpUsage[0].mvp+' ('+b.mvpUsage[0].count+')':'Chưa có dữ liệu'],['Hôm nay',Math.round(b.periods.day/60)+' phút'],['7 ngày',Math.round(b.periods.week/3600)+' giờ'],['Tháng này',Math.round(b.periods.month/3600)+' giờ']].map(x=>'<div class="card">'+x[0]+'<strong>'+x[1]+'</strong></div>').join('');document.querySelector('#mvp-rows').innerHTML=b.mvpUsage.length?b.mvpUsage.map(x=>'<tr><td>'+x.mvp+'</td><td>'+x.count+' lượt</td></tr>').join(''):'<tr><td colspan="2">Chưa có dữ liệu</td></tr>';document.querySelector('#rows').innerHTML=b.devices.map(d=>'<tr><td class="device-id" title="'+d.installationId+'">'+d.installationId+'</td><td>'+d.lastVersion+'</td><td>'+new Date(d.lastSeen).toLocaleString('vi-VN')+'</td><td>'+Math.round(d.activeSeconds/60)+' phút</td><td>'+(Date.now()-Date.parse(d.lastSeen)<=600000?'Đang hoạt động':'Không hoạt động')+'</td></tr>').join('')}loadUsage();</script></body></html>
